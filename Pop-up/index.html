<!DOCTYPE html>
<html lang="en">

<head>
    <!-- <meta charset="UTF-8"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Design</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <button type="submit" class="btn-popup" onclick ="openPopup()"> Submit Scorecard </button>
        <div class="popup" id="popup">
            <img src="tick.png">
            <h2> Thank You </h2>
            <p>Your Scorecard for Quiz has been successfully submitted. Thanks!</p>
            <button type="button" onclick ="closePopup()">OK</button>

        </div>
    </div>
    <script>
        let popup = document.getElementById("popup") ;

        function openPopup(){
            popup.classList.add("open-popup");
        }
        function closePopup(){

            popup.classList.remove("open-popup");
             window.location.href = "/project 1/index.html"
        }
    </script>
</body>

</html>
